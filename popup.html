<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>x-iq</title>
  <link rel="stylesheet" href="src/styles/popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="brand-x">x</span><span class="brand-iq">-iq</span>
      </div>
      <label class="x-toggle">
        <input type="checkbox" id="enableToggle">
        <span class="x-toggle-track"></span>
      </label>
    </header>

    <div class="section">
      <div class="section-label">Gemini API Key</div>
      <div class="api-key-row">
        <input type="password" id="apiKey" placeholder="Enter your API key">
        <button id="toggleApiKey" class="btn-icon" title="Toggle visibility">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="eyeOffIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
            <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
            <path d="m2 2 20 20"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="stats-section" id="statsSection">
      <div class="stat-card">
        <div class="stat-value" id="avgIQ">—</div>
        <div class="stat-label">Average IQ</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="analyzedCount">0</div>
        <div class="stat-label">Analyzed</div>
      </div>
    </div>

    <div class="section hide-section">
      <div class="hide-row">
        <div class="hide-label">
          <span>Hide low IQ</span>
          <span class="threshold-display">below <span id="thresholdValue">100</span></span>
        </div>
        <label class="x-toggle small">
          <input type="checkbox" id="hideLowIQ">
          <span class="x-toggle-track"></span>
        </label>
      </div>
      <input type="range" id="iqThreshold" min="70" max="130" value="100" class="threshold-slider">
    </div>

    <div class="iq-scale">
      <div class="scale-item">
        <span class="scale-dot" style="background: #ef4444;"></span>
        <span class="scale-label">&lt;85</span>
      </div>
      <div class="scale-item">
        <span class="scale-dot" style="background: #f97316;"></span>
        <span class="scale-label">85-99</span>
      </div>
      <div class="scale-item">
        <span class="scale-dot" style="background: #22c55e;"></span>
        <span class="scale-label">100-114</span>
      </div>
      <div class="scale-item">
        <span class="scale-dot" style="background: #3b82f6;"></span>
        <span class="scale-label">115-129</span>
      </div>
      <div class="scale-item">
        <span class="scale-dot" style="background: #a855f7;"></span>
        <span class="scale-label">130+</span>
      </div>
    </div>

    <p class="hint">IQ badges appear next to avatars on your timeline</p>
  </div>
  <script type="module" src="src/popup/popup.ts"></script>
</body>
</html>
